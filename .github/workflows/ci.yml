name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            android/go.sum
      - run: bash tests/ci/run.sh fast 2>&1 | tee fast.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: fast-failure
          path: fast.log
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: CLI shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/keyparcel-docker-cache
          key: docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-
      - run: bash tests/ci/run.sh cli "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
          KEYPARCEL_DOCKER_CACHE: ${{ runner.temp }}/keyparcel-docker-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: cli-${{ matrix.shard }}-failure
          path: |
            test-artifacts/
            !test-artifacts/**/*.test
            !test-artifacts/**/id_*
          retention-days: 7
          if-no-files-found: ignore

  gtk:
    name: GTK client
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/keyparcel-docker-cache
          key: docker-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'tests/e2e/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            docker-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'tests/e2e/Dockerfile') }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: desktop/client/build/container-cache
          key: go-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'go.mod', 'go.sum', 'desktop/client/go.mod', 'desktop/client/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'go.mod', 'go.sum', 'desktop/client/go.mod', 'desktop/client/go.sum') }}-
      - run: bash tests/ci/run.sh gtk
        env:
          KEYPARCEL_DOCKER_CACHE: ${{ runner.temp }}/keyparcel-docker-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: gtk-failure
          path: |
            test-artifacts/ci/gtk.log
            desktop/client/build/*.log
            desktop/client/build/session.*/*.log
            desktop/client/build/session.*/*.txt
            desktop/client/build/session.*/*.png
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        suite: [verification, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            android/go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        if: matrix.suite == 'client'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/keyparcel-docker-cache
          key: docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
            ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
            ${{ env.ANDROID_HOME }}/system-images/android-35/default/x86_64
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/ci/setup-android.sh') }}
      - name: Install Android SDK components
        run: bash tests/ci/setup-android.sh
      - name: Enable KVM access
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - run: bash tests/ci/run.sh android "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          KEYPARCEL_ANDROID_ACCEL: 'on'
          KEYPARCEL_DOCKER_CACHE: ${{ runner.temp }}/keyparcel-docker-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: android-${{ matrix.suite }}-failure
          path: |
            test-artifacts/
            !test-artifacts/**/*.test
            !test-artifacts/**/id_*
            android/build/*.log
            android/build/*.txt
            android/build/*report.json
            android/client/build/*.log
            android/client/build/*.png
            android/client/app/build/test-results/
            android/client/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
