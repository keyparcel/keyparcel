name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            android/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - run: bash tests/ci/run.sh fast 2>&1 | tee fast.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: fast-failure
          path: fast.log
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: CLI shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/keyparcel-docker-cache
          key: docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-
      - run: bash tests/ci/run.sh cli "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
          KEYPARCEL_DOCKER_CACHE: ${{ runner.temp }}/keyparcel-docker-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: cli-${{ matrix.shard }}-failure
          path: |
            test-artifacts/
            !test-artifacts/**/*.test
            !test-artifacts/**/id_*
          retention-days: 7
          if-no-files-found: ignore

  gtk:
    name: GTK client
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/keyparcel-docker-cache
          key: docker-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'tests/e2e/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            docker-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'tests/e2e/Dockerfile') }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: desktop/client/build/container-cache
          key: go-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'go.mod', 'go.sum', 'desktop/client/go.mod', 'desktop/client/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/client/Dockerfile', 'go.mod', 'go.sum', 'desktop/client/go.mod', 'desktop/client/go.sum') }}-
      - run: bash tests/ci/run.sh gtk
        env:
          KEYPARCEL_DOCKER_CACHE: ${{ runner.temp }}/keyparcel-docker-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: gtk-failure
          path: |
            test-artifacts/ci/gtk.log
            desktop/client/build/*.log
            desktop/client/build/session.*/*.log
            desktop/client/build/session.*/*.txt
            desktop/client/build/session.*/*.png
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: verification, name: verification}
          - {suite: client, shard: network, name: client network}
          - {suite: client, shard: files, name: client files}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            android/go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        if: matrix.suite == 'client'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/keyparcel-docker-cache
          key: docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-ssh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/Dockerfile*', 'go.mod', 'go.sum') }}-
      - name: Prepare user-owned Android SDK
        id: sdk-layout
        run: bash tests/ci/prepare-android-sdk.sh
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: sdk-cache
        with:
          path: |
            ${{ runner.temp }}/keyparcel-android-sdk/platform-tools
            ${{ runner.temp }}/keyparcel-android-sdk/emulator
            ${{ runner.temp }}/keyparcel-android-sdk/platforms
            ${{ runner.temp }}/keyparcel-android-sdk/build-tools
            ${{ runner.temp }}/keyparcel-android-sdk/ndk
            ${{ runner.temp }}/keyparcel-android-sdk/system-images
            ${{ runner.temp }}/keyparcel-android-sdk/licenses
          key: android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk-layout.outputs.image }}-${{ hashFiles('tests/ci/*android*.sh') }}
          restore-keys: |
            android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk-layout.outputs.image }}-${{ hashFiles('tests/ci/*android*.sh') }}-
      - name: Install Android SDK components
        id: sdk-install
        run: bash tests/ci/setup-android.sh
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: matrix.suite == 'verification' && steps.sdk-cache.outputs.cache-matched-key != format('{0}-{1}', steps.sdk-cache.outputs.cache-primary-key, steps.sdk-install.outputs.revision)
        with:
          path: |
            ${{ runner.temp }}/keyparcel-android-sdk/platform-tools
            ${{ runner.temp }}/keyparcel-android-sdk/emulator
            ${{ runner.temp }}/keyparcel-android-sdk/platforms
            ${{ runner.temp }}/keyparcel-android-sdk/build-tools
            ${{ runner.temp }}/keyparcel-android-sdk/ndk
            ${{ runner.temp }}/keyparcel-android-sdk/system-images
            ${{ runner.temp }}/keyparcel-android-sdk/licenses
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}-${{ steps.sdk-install.outputs.revision }}
      - name: Enable KVM access
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - run: bash tests/ci/run.sh android "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          KEYPARCEL_ANDROID_CLIENT_SHARD: ${{ matrix.shard }}
          KEYPARCEL_ANDROID_ACCEL: 'on'
          KEYPARCEL_DOCKER_CACHE: ${{ runner.temp }}/keyparcel-docker-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          name: android-${{ matrix.name }}-failure
          path: |
            test-artifacts/
            !test-artifacts/**/*.test
            !test-artifacts/**/id_*
            android/build/*.log
            android/build/*.txt
            android/build/*report.json
            android/client/build/*.log
            android/client/build/*.png
            android/client/app/build/test-results/
            android/client/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && matrix.suite == 'client'
        with:
          name: android-client-${{ matrix.shard }}-screenshots
          path: android/client/build/*.png
          retention-days: 7
          if-no-files-found: error

  android-client:
    name: Android client
    if: always()
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - name: Require both client shards and verification
        env:
          RESULT: ${{ needs.android.result }}
        run: test "$RESULT" = success

  transport-benchmark:
    name: Transport benchmark ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: small, timeout: 6}
          - {suite: bulk, timeout: 6}
    # Independent informational checks: no required aggregate depends on these jobs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Measure production transports
        run: bash tests/bench/run.sh "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
      - name: Summarize measurements
        if: always()
        run: |
          if [[ -f test-artifacts/bench/$SUITE.log ]]; then
            printf '### Transport benchmark: %s\n\n```text\n' "$SUITE" >> "$GITHUB_STEP_SUMMARY"
            cat "test-artifacts/bench/$SUITE.log" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SUITE: ${{ matrix.suite }}
