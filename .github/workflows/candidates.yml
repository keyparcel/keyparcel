name: Release candidates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: candidates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-build:
    name: Build Linux packages (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu24.04-amd64, fedora44-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -m unittest discover -s release -p '*_test.py'
      - run: echo "RELEASE_VERSION=$(cat release/VERSION)" >> "$GITHUB_ENV"
      - run: |
          mkdir -p release/out
          python3 release/build.py linux --linux-target "${{ matrix.target }}" --require-clean --version "$RELEASE_VERSION" 2>&1 | tee release/out/candidate-build.log
      # Internal validation inputs include the old-name package fixture, never a release asset.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-validation-${{ matrix.target }}
          path: release/out/${{ env.RELEASE_VERSION }}/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-candidates-${{ matrix.target }}
          path: |
            release/out/**/*.deb
            release/out/**/*.rpm
            release/out/**/*.tar.gz
            release/out/**/build-info.json
            release/out/candidate-build.log
          retention-days: 7
  linux-validate:
    name: Installed packages (${{ matrix.distro }})
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            target: ubuntu24.04-amd64
          - distro: debian13
            target: ubuntu24.04-amd64
          - distro: fedora44
            target: fedora44-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: echo "RELEASE_VERSION=$(cat release/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-validation-${{ matrix.target }}
          path: release/out/${{ env.RELEASE_VERSION }}/${{ matrix.target }}/
      - run: python3 release/validate.py "release/out/$RELEASE_VERSION" --distro "${{ matrix.distro }}" --revision "$(git rev-parse HEAD)" 2>&1 | tee release/out/candidate-validation.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-validation-results-${{ matrix.distro }}
          path: |
            release/out/candidate-validation.log
            test-artifacts/
            desktop/client/build/session.*/
            !**/id_*
          retention-days: 7
  linux:
    name: Linux installed packages
    if: always()
    needs: [linux-build, linux-validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every build and distro validation
        env:
          BUILD_RESULT: ${{ needs.linux-build.result }}
          VALIDATE_RESULT: ${{ needs.linux-validate.result }}
        run: test "$BUILD_RESULT" = success && test "$VALIDATE_RESULT" = success
  android:
    name: Android ARM64 candidate (static)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: android/go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install build-only Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || test "${PIPESTATUS[1]}" = 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - run: |
          mkdir -p release/out
          python3 release/build.py android --require-clean --version "$(cat release/VERSION)" --android-code "$(cat release/ANDROID_VERSION_CODE)" 2>&1 | tee release/out/candidate-android.log
      - name: Test signing with a disposable key (never release secrets)
        run: python3 release/sign_test.py "release/out/$(cat release/VERSION)/android-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-arm64-candidate
          path: |
            release/out/*/android-arm64/*.apk
            release/out/**/build-info.json
            release/out/**/apk-*.txt
            release/out/candidate-android.log
          retention-days: 7
