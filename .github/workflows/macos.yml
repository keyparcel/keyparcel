name: macOS CLI

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to test and package
        type: choice
        options: [both, arm64, amd64]
        default: both
      attach_to_draft:
        description: Attach both verified packages when running on a release tag
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: macOS CLI (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'both' && '["arm64","amd64"]' || format('["{0}"]', inputs.architecture)) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate annotated release tag before native checks
        if: github.ref_type == 'tag' && inputs.architecture == 'both' && inputs.attach_to_draft
        run: python3 release/macos_attach.py tag
      - run: bash tests/ci/macos.sh 2>&1 | tee "$RUNNER_TEMP/macos.log"
        env:
          EXPECTED_MACHINE: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          EXPECTED_GOARCH: ${{ matrix.arch }}
      - name: Bind successful native artifacts to the annotated tag object
        if: github.ref_type == 'tag' && inputs.architecture == 'both' && inputs.attach_to_draft
        run: python3 release/macos_attach.py record --source "release/out/macos-$ARCH"
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: macos-cli-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/macos.log
            test-artifacts/**/transcript.txt
            test-artifacts/**/server.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: macos-cli-unsigned-${{ matrix.arch }}
          path: |
            release/out/macos-${{ matrix.arch }}/keyparcel-cli-*.pkg
            release/out/macos-${{ matrix.arch }}/build-info.json
          retention-days: 7
          if-no-files-found: ignore

  attach:
    name: Attach verified macOS packages to draft
    if: github.ref_type == 'tag' && inputs.architecture == 'both' && inputs.attach_to_draft
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: macos-cli-unsigned-*
          path: release/out/macos-attach
      - name: Validate both packages and attach to the existing unpublished draft
        run: python3 release/macos_attach.py attach
        env:
          GH_TOKEN: ${{ github.token }}
